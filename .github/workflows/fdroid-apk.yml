name: F-Droid APK (GMS-free personal build)

# Builds the F-Droid source profile of the Paseo Android app
# (see docs/android.md): no Firebase/GMS native modules, no push
# notifications. Source is this fork's fdroid-v0.11.1 branch (upstream
# v0.11.1 + patches), which also restores QR pairing scanning without
# Google services (local paseo-qrscan module: CameraX + ZXing).
# The APK is signed with a personal keystore kept in repo secrets so
# future builds can update in place.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Fork branch or tag to build"
        required: true
        default: "fdroid-v0.11.1"
        type: string

permissions:
  contents: write

concurrency:
  group: fdroid-apk-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # Build this fork's fdroid-v0.11.1 branch: upstream v0.11.1 plus
          # the fork's patches (GMS-free QR scanning). The fork also carries
          # a backup of the upstream v0.11.1 tag.
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install JS dependencies
        run: node scripts/npm-retry.mjs ci

      - name: Build app workspace dependencies
        # Metro bundling fails without the workspace dist outputs
        # (@getpaseo/highlight/dist/index.js etc.). Upstream CI and the
        # app's eas-build-post-install hook both run this step.
        run: npm run build:app-deps

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          # Pre-install the exact NDK AGP asks for. Letting Gradle fetch it
          # mid-build failed once with a corrupt download
          # ("Archive is not a ZIP archive", run 37652399005), so install it
          # here with retries and partial-install cleanup instead.
          for i in 1 2 3; do
            if "$SDKMANAGER" "ndk;27.1.12297006"; then
              break
            fi
            echo "NDK install attempt $i failed; cleaning partial install"
            rm -rf "$ANDROID_HOME/ndk/27.1.12297006"
            if [ "$i" -eq 3 ]; then
              echo "NDK install failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Restore signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is missing."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.p12"

      - name: Expo prebuild (F-Droid profile)
        env:
          PASEO_FDROID_BUILD: "1"
          APP_VARIANT: production
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app
          npx expo prebuild --platform android --clean --non-interactive

      - name: Bump install versionCode (+2)
        shell: bash
        run: |
          # Same versionName as the previous 0.11.1 build, which already
          # shipped with +1, so bump the generated versionCode by +2 to
          # stay above it and let phones install this build over it.
          # The F-Droid plugin multiplies the base
          # versionCode by 10 and adds an ABI suffix at configuration
          # time, so bumping the literal here flows through.
          set -euo pipefail
          python3 - <<'EOF'
          import re
          p = "packages/app/android/app/build.gradle"
          s = open(p).read()
          m = re.search(r"versionCode\s+(\d+)", s)
          assert m, "versionCode not found in app/build.gradle"
          bumped = int(m.group(1)) + 2
          s = s[:m.start(1)] + str(bumped) + s[m.end(1):]
          open(p, "w").write(s)
          print(f"versionCode bumped: {m.group(1)} -> {bumped}")
          EOF

      - name: Bridge local modules into F-Droid autolinking overlay
        shell: bash
        run: |
          # The F-Droid plugin points expoAutolinking.projectRoot at
          # android/fdroid-autolinking, so autolinking looks for local
          # modules under <overlay>/modules and silently drops the real
          # ones in packages/app/modules — including paseo-scroll, whose
          # PaseoScrollPackage MainApplication registers (compile error
          # "Unresolved reference 'scroll'", run 37660310675). Upstream's
          # F-Droid profile (2026-07) predates paseo-scroll (2026-09) and
          # was never re-verified. Symlink the real modules dir into the
          # overlay to restore parity with the normal build.
          set -euo pipefail
          OVERLAY="packages/app/android/fdroid-autolinking"
          ls "$OVERLAY"
          if [ ! -e "$OVERLAY/modules" ]; then
            ln -s ../../modules "$OVERLAY/modules"
          fi
          ls "$OVERLAY/modules"

      - name: Add swap headroom for native build
        shell: bash
        run: |
          # Three consecutive runs (37647706615, 37653718702, 37657220885)
          # were cancelled with no error at the same point: right after the
          # JS bundle finished, during the native (CMake/NDK) compile —
          # the signature of the standard runner dying under memory
          # pressure. Give it swap headroom before the heavy phase.
          set -euxo pipefail
          sudo fallocate -l 12G /swapfile-paseo || sudo dd if=/dev/zero of=/swapfile-paseo bs=1M count=12288
          sudo chmod 600 /swapfile-paseo
          sudo mkswap /swapfile-paseo
          sudo swapon /swapfile-paseo
          free -h

      - name: Gradle assembleRelease (arm64-v8a)
        env:
          PASEO_FDROID_BUILD: "1"
        shell: bash
        run: |
          set -euo pipefail
          cd packages/app/android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            --no-daemon --max-workers=1 -Dorg.gradle.parallel=false

      - name: Sign and verify APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          SRC="$(find packages/app/android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          echo "Built APK: $SRC"
          OUT="paseo-fdroid-v0.11.1-arm64.apk"
          "$BT/zipalign" -f -p 4 "$SRC" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/upload-keystore.p12" \
            --ks-type PKCS12 \
            --ks-key-alias upload \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out "$OUT" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paseo-fdroid-apk-${{ inputs.source_ref }}
          path: ${{ env.APK_OUT }}
          if-no-files-found: error

      - name: Publish APK to fork release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="fdroid-v0.11.1"
          # Pin releases to this fork explicitly (the build workspace is a
          # plain checkout; gh must not guess another repo from remotes).
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Paseo $TAG (GMS-free personal build)" \
            --notes "F-Droid profile build of Paseo for phones without Google services (e.g. Huawei). No Firebase/GMS code, no push notifications. QR pairing scanning restored via CameraX + ZXing (no ML Kit/GMS). arm64-v8a." \
            2>/dev/null || true
          gh release upload "$TAG" "$APK_OUT" --repo "${{ github.repository }}" --clobber
